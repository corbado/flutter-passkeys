name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"

      - name: Set up melos
        uses: bluefireteam/melos-action@v3

      - name: Check formatting
        run: melos format --set-exit-if-changed

      - name: Analyze
        run: melos analyze --fatal-infos

      - name: Test
        run: melos test

  build:
    name: Build ${{ matrix.name }}
    needs: analyze-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            build: flutter build apk --debug
          - name: Web
            os: ubuntu-latest
            build: flutter build web
          - name: Windows
            os: windows-latest
            build: flutter build windows --debug
          - name: macOS
            os: macos-latest
            # The example is configured for automatic signing with a
            # placeholder team, so CI builds it without code signing.
            build: |
              flutter build macos --debug --config-only
              xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          - name: iOS (Swift Package Manager)
            os: macos-latest
            swift-package-manager: true
            build: flutter build ios --debug --no-codesign
          - name: iOS (CocoaPods)
            os: macos-latest
            swift-package-manager: false
            build: flutter build ios --debug --no-codesign
          # Guards against using APIs that only exist in the newest SDK. The
          # runtime availability checks in the native code do not stop the
          # compiler from needing the symbol, so one SDK back has to be built
          # against explicitly. This cannot go further back than 26.1 until
          # device_info_plus stops referencing isiOSAppOnVision, which is
          # itself a 26.1 SDK API.
          # Builds for the simulator because the runner image only installs the
          # device platform for its default Xcode. The simulator SDK carries
          # the same declarations, so it guards the same mistake.
          - name: iOS (previous Xcode)
            os: macos-latest
            xcode: "~26.1"
            swift-package-manager: false
            build: flutter build ios --debug --simulator

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        if: matrix.name == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Xcode
        if: matrix.xcode != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      # The runner image only installs the iOS platform for its default Xcode,
      # and without it ibtool cannot compile the example's storyboards. This is
      # deliberately not cached: the image is 7.7 GiB, which restores slower
      # than Apple serves it and would take up most of the 10 GiB cache budget.
      - name: Install the iOS platform
        if: matrix.xcode != ''
        run: sudo xcodebuild -downloadPlatform iOS

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"

      - name: Set up melos
        uses: bluefireteam/melos-action@v3

      - name: Enable Swift Package Manager
        if: matrix.swift-package-manager == true
        run: flutter config --enable-swift-package-manager

      - name: Disable Swift Package Manager
        if: matrix.swift-package-manager == false
        run: flutter config --no-enable-swift-package-manager

      - name: Build
        working-directory: packages/passkeys/passkeys/example
        run: ${{ matrix.build }}
